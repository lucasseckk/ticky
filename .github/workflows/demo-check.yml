name: Demo-Check
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demo-Test
        run: |
          if [ -f demo/fehler.txt ]; then
            echo "Absichtlich fehlgeschlagen, weil demo/fehler.txt existiert."
            exit 1
          fi
          echo "Alles grün."
