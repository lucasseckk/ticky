name: Release
# A tag like v1.2.0 publishes Ticky.zip as a GitHub release (#112).
# Only a tag on a commit of main that passes check.command is published (#125).
# Pull requests that touch this file only build the zip as a workflow artifact.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'install.sh']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be vX.Y.Z on a commit of main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag $GITHUB_REF_NAME ist nicht vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA liegt nicht auf main"; exit 1; }
      - name: Checks
        run: zsh check.command
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Info.plist
      - name: Build universal app
        run: |
          swift build -c release --arch arm64 --arch x86_64
          app=Ticky.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          cp .build/apple/Products/Release/Ticky $app/Contents/MacOS/Ticky
          cp Info.plist $app/Contents/Info.plist
          cp Resources/AppIcon.icns $app/Contents/Resources/AppIcon.icns
          mkdir -p $app/Contents/Resources/de.lproj $app/Contents/Resources/en.lproj
          echo '{}' | plutil -convert binary1 -o $app/Contents/Resources/de.lproj/Localizable.strings -
          plutil -convert binary1 -o $app/Contents/Resources/en.lproj/Localizable.strings Resources/Localizable.en.json
          lipo -archs $app/Contents/MacOS/Ticky
      # Developer ID + notarization once the secrets exist (#124); until then ad-hoc as before.
      # Secrets reach only tag builds, never pull requests.
      - name: Sign and notarize
        env:
          CERTIFICATE_P12: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_CERTIFICATE_P12 || '' }}
          CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          SIGNING_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_SIGNING_IDENTITY || '' }}
          NOTARY_APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.NOTARY_APPLE_ID || '' }}
          NOTARY_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.NOTARY_TEAM_ID || '' }}
          NOTARY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.NOTARY_PASSWORD || '' }}
        run: |
          app=Ticky.app
          mkdir dist
          if [[ -z "$CERTIFICATE_P12" ]]; then
            echo "::warning::Keine Signier-Secrets – Ticky.app wird nur ad-hoc signiert und nicht notarisiert."
            codesign --force --sign - $app
            ditto -c -k --keepParent $app dist/Ticky.zip
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$SIGNING_IDENTITY" $app
          codesign --verify --deep --strict --verbose=2 $app
          ditto -c -k --keepParent $app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple $app
          xcrun stapler validate $app
          spctl --assess --type execute --verbose $app
          ditto -c -k --keepParent $app dist/Ticky.zip
          security delete-keychain "$keychain"
      - name: Installer pinned to this release
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="v0.0.0-test"
          sed -e "s/^release_version=.*/release_version=\"$version\"/" -e "s/^release_commit=.*/release_commit=\"$GITHUB_SHA\"/" install.sh > dist/install.sh
          grep -q "^release_commit=\"$GITHUB_SHA\"" dist/install.sh
          zsh -n dist/install.sh
      - name: SHA-256
        run: cd dist && shasum -a 256 Ticky.zip install.sh | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ticky
          path: dist/
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Ticky
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          zip_sum=$(awk '$2 == "Ticky.zip" { print $1 }' SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" Ticky.zip install.sh SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Ticky $GITHUB_REF_NAME" --generate-notes \
            --notes "Gebaut aus Commit $GITHUB_SHA. SHA-256 von Ticky.zip: \`$zip_sum\`"
