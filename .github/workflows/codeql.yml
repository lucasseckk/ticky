name: CodeQL
# Code scanning for Swift (#128). GitHub offers it for free only on public repositories,
# so the job is skipped while the repository is private.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
      - name: Build
        run: swift build
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
